version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: book_management_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - book_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: book_management_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - JWT_SECRET=your_super_secret_key
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      - mongodb
    networks:
      - book_network
    volumes:
      - backend_uploads:/app/static/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: book_management_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - book_network

networks:
  book_network:
    driver: bridge

volumes:
  mongodb_data:
  backend_uploads:
